name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parrotspeak_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type checking
      run: npm run type-check

    - name: Lint
      run: npx eslint .

    - name: Build backend API
      run: npm run build

    - name: Database schema validation
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parrotspeak_test
      run: |
        npm run db:push
        npm run db:seed

  test-mobile:
    name: Test Mobile App (Expo)
    runs-on: ubuntu-latest

    # NOTE: this is a mobile-native-only app. The mobile app lives at the repo
    # root (same package.json as the backend), not in a separate `mobile-app/`
    # subdirectory — a previous version of this job assumed a monorepo layout
    # that doesn't match this repo and silently no-op'd/failed as a result.
    # There is intentionally no web build/export step here: ParrotSpeak has no
    # supported web target.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type checking (mobile)
      run: npm run type-check

    # Non-blocking for now: expo-doctor currently reports 6 pre-existing issues
    # (unused expo-router with missing peer deps, eas-cli installed as a
    # project dependency, several Expo support-package version mismatches,
    # an app.config.js/prebuild conflict, and outdated Expo-ecosystem
    # packages). Surfaced here for visibility; flip to blocking once fixed.
    - name: Validate Expo project config
      run: npx expo-doctor
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=high

    - name: Check for vulnerabilities
      run: npx audit-ci --high

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-backend, test-mobile, security-scan]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Deploy to staging
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-mobile, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Deploy to production
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here

  mobile-build:
    name: Build Mobile App
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Expo CLI
      run: npm install -g @expo/cli

    - name: Install dependencies
      working-directory: ./mobile-app
      run: npm ci

    - name: Build for app stores (iOS)
      working-directory: ./mobile-app
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        # eas build --platform ios --non-interactive
        echo "iOS build would run here with proper EAS setup"

    - name: Build for app stores (Android)
      working-directory: ./mobile-app
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        # eas build --platform android --non-interactive
        echo "Android build would run here with proper EAS setup"
